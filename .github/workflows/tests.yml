name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.13"}
          # Python 3.9 has no builds for Ubuntu 26.04, which ubuntu-latest becomes in October 2026.
          - {os: ubuntu-24.04, python: "3.9"}
          - {os: windows-latest, python: "3.13"}
          - {os: windows-latest, python: "3.9"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Optional libraries
        run: python -m pip install manifold3d numpy rtree
      - name: OpenSCAD
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  skill-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install skills-ref==0.1.1
      - name: Agent Skills format
        run: agentskills validate "$GITHUB_WORKSPACE"
