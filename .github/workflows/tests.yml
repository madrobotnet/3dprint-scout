name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Optional libraries
        run: python -m pip install manifold3d numpy rtree
      - name: OpenSCAD
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  skill-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install skills-ref==0.1.1
      - name: Agent Skills format
        run: agentskills validate "$GITHUB_WORKSPACE"
