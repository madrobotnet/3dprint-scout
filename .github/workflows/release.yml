name: release

# Pushing a tag such as v0.1.0 builds the zip that Claude's "Upload a skill" expects
# (one top-level folder named after the skill) and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the skill zip
        run: |
          mkdir -p dist/3dprint-scout
          cp -r SKILL.md LICENSE README.md README.ko.md CHANGELOG.md scripts references dist/3dprint-scout/
          find dist -name __pycache__ -prune -exec rm -rf {} +
          (cd dist && zip -qr "3dprint-scout-${GITHUB_REF_NAME}.zip" 3dprint-scout)
      - name: Release notes from CHANGELOG.md
        run: awk '/^## /{n++} n==1' CHANGELOG.md > dist/notes.md
      - name: Create the release, or refresh its zip if it already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/3dprint-scout-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
          fi
